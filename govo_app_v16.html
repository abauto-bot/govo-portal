<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Home — GOVO Express</title>
<style id="govo-v16-tokens">
:root{
  --bg:#04120f;--bg2:#071c17;--card:#0e2a23;--card2:#12382f;
  --line:rgba(255,255,255,.13);--text:#f4fff9;--muted:#a9c8bd;
  --green:#22e68a;--green2:#0fbf70;--gold:#f6cf68;--red:#ff6b6b;
  --on-primary:#02110a;--field:rgba(255,255,255,.065);--option:#08231d;
  --bar:rgba(4,18,15,.88);--bar2:rgba(5,18,15,.94);
  --cardbg:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));
  --pagebg:radial-gradient(circle at 12% -10%,rgba(34,230,138,.22),transparent 34%),radial-gradient(circle at 90% 0%,rgba(246,207,104,.10),transparent 28%),linear-gradient(160deg,#010504,#04120f 46%,#08261f);
  --focus:#4ef0a4;--shadow:0 22px 70px rgba(0,0,0,.22);
}
[data-theme="light"]{
  --bg:#eef6f1;--bg2:#ffffff;--card:#ffffff;--card2:#eef6f1;
  --line:rgba(6,40,25,.15);--text:#07281a;--muted:#47604f;
  --green:#0aa95c;--green2:#07874a;--gold:#8a6d1d;--red:#c0392b;
  --on-primary:#ffffff;--field:#ffffff;--option:#ffffff;
  --bar:rgba(255,255,255,.92);--bar2:rgba(255,255,255,.96);
  --cardbg:#ffffff;
  --pagebg:radial-gradient(circle at 12% -10%,rgba(10,169,92,.14),transparent 34%),radial-gradient(circle at 90% 0%,rgba(10,169,92,.08),transparent 28%),linear-gradient(160deg,#f4faf6,#eef6f1 46%,#e4f1e9);
  --focus:#07874a;--shadow:0 14px 40px rgba(6,40,25,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--pagebg);background-attachment:fixed;color:var(--text);font-size:16px}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding:18px 14px 110px}
.top{position:sticky;top:0;z-index:30;background:var(--bar);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.topin{max-width:1120px;margin:auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:17px;display:grid;place-items:center;flex:0 0 auto;overflow:hidden;background:linear-gradient(135deg,var(--green),#075c39);box-shadow:0 10px 32px rgba(34,230,138,.24)}
.logo svg,.logo img{width:100%;height:100%;object-fit:contain;display:block}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:18px;letter-spacing:.2px}
.brand small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.menu{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:var(--field);font-weight:850;cursor:pointer;min-height:44px}
.btn.primary{background:linear-gradient(135deg,var(--green),var(--green2));color:var(--on-primary);border:0}
.btn.gold{background:rgba(246,207,104,.14);border-color:rgba(246,207,104,.38);color:var(--gold)}
[data-theme="light"] .btn.gold{background:rgba(138,109,29,.10);border-color:rgba(138,109,29,.35);color:var(--gold)}
.btn.danger{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.4);color:var(--red)}
.btn.block{width:100%}
.btn[disabled],button[disabled]{opacity:.55;cursor:not-allowed}
.drawer{position:relative}
.drawer summary{list-style:none;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:15px;background:var(--field);font-size:22px}
.drawer summary::-webkit-details-marker{display:none}
.drawerbox{position:absolute;right:0;top:54px;width:min(340px,94vw);background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:14px;box-shadow:0 28px 90px rgba(0,0,0,.48);max-height:80vh;overflow:auto}
.drawerbox a{display:flex;justify-content:space-between;gap:10px;padding:13px 12px;border-radius:16px;color:var(--text);font-weight:850;min-height:44px;align-items:center}
.drawerbox a:hover{background:rgba(34,230,138,.10)}
.drawer-label{margin:10px 4px 6px;color:var(--muted);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);border-radius:13px;padding:11px 6px;background:var(--field);color:var(--text);font-weight:850;font-size:13px;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:rgba(34,230,138,.16);border-color:var(--green);color:var(--text)}
.hero{padding:26px 0 14px}
.kicker{display:inline-flex;padding:8px 12px;border:1px solid rgba(34,230,138,.30);border-radius:999px;color:#bdf6da;background:rgba(34,230,138,.08);font-weight:900}
[data-theme="light"] .kicker{color:#065f36;background:rgba(10,169,92,.10);border-color:rgba(10,169,92,.35)}
h1{font-size:clamp(30px,6.4vw,62px);line-height:1;margin:14px 0 12px;letter-spacing:-1.8px}
.lead{font-size:17px;line-height:1.6;color:var(--muted);max-width:790px;margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.grid.three{grid-template-columns:repeat(3,1fr)}
.grid.two{grid-template-columns:repeat(2,1fr)}
.card{background:var(--cardbg);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.card.link{transition:.16s ease;display:block;color:inherit}
.card.link:hover{transform:translateY(-2px);border-color:rgba(34,230,138,.34)}
.card h3{margin:8px 0 6px;font-size:18px}
.card p{margin:0;color:var(--muted);line-height:1.45}
.icon{font-size:31px}
.tag{display:inline-block;margin-top:12px;padding:6px 10px;border-radius:999px;background:rgba(34,230,138,.10);color:#bdf6da;font-size:12px;font-weight:950}
[data-theme="light"] .tag{color:#065f36;background:rgba(10,169,92,.12)}
.section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-top:26px}
.section-title h2{margin:0;font-size:25px}
.form{display:grid;gap:10px;max-width:760px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:16px;background:var(--field);color:var(--text);padding:13px 14px;font-size:15px;outline:none;min-height:46px}
select option{background:var(--option);color:var(--text)}
[data-theme="light"] select option{color:#07281a}
textarea{min-height:104px}
label{font-weight:850;color:var(--text)}
.hint{color:var(--muted);font-size:13px;margin:-4px 0 0}
.notice{border:1px dashed rgba(246,207,104,.42);background:rgba(246,207,104,.09);color:var(--gold);border-radius:20px;padding:14px;margin:14px 0;line-height:1.5}
.errorbox{border:1px solid rgba(255,107,107,.4);background:rgba(255,107,107,.10);color:var(--red);border-radius:20px;padding:14px;margin:14px 0;line-height:1.5}
.offline{position:sticky;top:66px;z-index:20;margin:0 auto 10px;max-width:1120px;border:1px solid rgba(246,207,104,.5);background:rgba(80,60,4,.92);color:#ffe7a6;border-radius:14px;padding:10px 14px;font-weight:850;display:none}
.offline.show{display:block}
.area{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.area span{padding:7px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:850;font-size:13px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bar2);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.bottomin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 10px}
.nav{padding:9px 6px;border-radius:16px;text-align:center;color:var(--muted);font-size:12px;font-weight:850;min-height:52px}
.nav b{display:block;font-size:18px}
.nav.active{background:rgba(34,230,138,.12);color:var(--text)}
.skel{border-radius:24px;border:1px solid var(--line);background:var(--cardbg);min-height:120px;position:relative;overflow:hidden}
.skel:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.10) 50%,transparent 70%);animation:sk 1.2s infinite}
@keyframes sk{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.steps{display:flex;gap:6px;margin:14px 0}
.steps i{flex:1;height:5px;border-radius:99px;background:var(--field);border:1px solid var(--line)}
.steps i.on{background:var(--green);border-color:var(--green)}
.typick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.typick button{border:1px solid var(--line);border-radius:20px;background:var(--cardbg);padding:16px 12px;text-align:left;cursor:pointer;color:var(--text);min-height:88px}
.typick button[aria-pressed="true"]{border-color:var(--green);box-shadow:0 0 0 2px rgba(34,230,138,.25) inset}
.typick .icon{font-size:26px}
.typick b{display:block;margin:6px 0 3px;font-size:16px}
.typick small{color:var(--muted)}
.recbox{display:grid;gap:10px;justify-items:start}
.recdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative;width:92px;height:92px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-weight:900;cursor:pointer}
.review{display:grid;gap:8px}
.review div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:8px 0}
.review span{color:var(--muted)}
.success-id{font-size:24px;font-weight:950;letter-spacing:.4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.flow{counter-reset:step}
.step{position:relative;padding-left:54px}
.step:before{counter-increment:step;content:counter(step);position:absolute;left:16px;top:16px;width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:rgba(34,230,138,.15);color:#bdf6da;font-weight:950;border:1px solid rgba(34,230,138,.25)}
[data-theme="light"] .step:before{color:#065f36}
@media(max-width:900px){.grid,.grid.three{grid-template-columns:repeat(2,1fr)}.menu .pill{display:none}}
@media(max-width:540px){.grid,.grid.three,.grid.two{grid-template-columns:1fr}h1{font-size:34px}.card{border-radius:20px}.wrap{padding-left:12px;padding-right:12px}.actions .btn{flex:1}.drawerbox{right:-4px}.typick{grid-template-columns:1fr 1fr}}
</style>

var LANGS=[{k:'en',label:'English'},{k:'bn',label:'বাংলা'},{k:'bl',label:'Banglish'}];
var lang=localStorage.getItem('govo.lang.v1')||'en';
if(!I18N[lang]) lang='en';
function t(k){var d=I18N[lang]||{};if(d[k]!=null)return d[k];if(I18N.en[k]!=null)return I18N.en[k];return k;}
/* ================= THEME ================= */
var themeChoice=localStorage.getItem('govo.theme.v1')||'system';
var mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: light)'):null;
function applyTheme(){var m=themeChoice==='system'?(mq?(mq.matches?'light':'dark'):'light'):themeChoice;document.documentElement.setAttribute('data-theme',m);}
if(mq&&mq.addEventListener)mq.addEventListener('change',function(){if(themeChoice==='system')applyTheme();});
applyTheme();
/* ================= CORE ================= */
var API=location.origin+'/api/govo-flow';
var main=document.getElementById('main');
var sr=document.getElementById('sr');
var areas=['Meherpur','Gangni','Bamundi','Mujibnagar','Amjhupi'];
var cats=['All Shops','Food and local shop delivery','General delivery booking','Bike/auto transport request','Doctor appointment','Agriculture products','Domestic/home services','House rent','Other local services'];
var draftKey='govo.customer.request.draft.v16';
var profileKey='govo.profile.v1';
var lastReqKey='govo.last.request.v1';
var inFlight=false;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function say(msg){sr.textContent='';setTimeout(function(){sr.textContent=msg;},30);}
function getProfile(){try{return JSON.parse(localStorage.getItem(profileKey)||'{}');}catch(e){return {};}}
function saveProfile(p){try{localStorage.setItem(profileKey,JSON.stringify(p));}catch(e){}}
function errText(code){var map={invalid_phone:'invalidPhone',missing_fields:'missingFields',missing_details:'missingDetails',file_too_large:'imageTooBig',unsupported_file_type:'imageTooBig'};return t(map[code]||'errorLoad');}
function api(path,opts){
  var ctl=new AbortController();var timer=setTimeout(function(){ctl.abort();},20000);
  opts=Object.assign({headers:{Accept:'application/json'},credentials:'same-origin',signal:ctl.signal},opts||{});
  return fetch(API+path,opts).then(function(r){clearTimeout(timer);var ct=r.headers.get('content-type')||'';if(ct.indexOf('json')===-1){throw new Error(t('errorLoad'));}return r.json().then(function(j){if(!r.ok||j.ok===false){var e=new Error(errText(j.error||j.code));e.data=j;throw e;}return j;});},function(){clearTimeout(timer);throw new Error(t('offlineMsg'));});
}
function postJSON(path,data){return api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});}
function path(){var p=location.pathname.replace(/\/+/g,'/').replace(/\/$/,'')||'/';if(p==='/app')p='/';if(p==='/service')p='/services';if(p==='/help')p='/support';return p;}
function setTitle(x){document.title=x+' — GOVO Express';}
function activeKey(p){if(p==='/')return 'home';if(p.indexOf('/shops')===0)return 'shops';if(p.indexOf('/services')===0)return 'services';if(/^\/order|^\/one-tap|^\/voice|^\/image/.test(p))return 'order';if(p==='/support'||p==='/profile'||p==='/notifications'||p==='/search')return 'support';return '';}

function renderChrome(){
  document.querySelectorAll('[data-logo]').forEach(function(el){el.innerHTML=BRAND.logoSvg;});
  document.querySelectorAll('[data-i]').forEach(function(el){el.textContent=t(el.getAttribute('data-i'));});
  var navItems=[['/','home','navHome'],['/shops','shops','navShops'],['/services','services','navServices'],['/order','order','navOrder'],['/support','help','navHelp']];
  document.getElementById('bottomnav').innerHTML=navItems.map(function(n){return '<a class="nav" data-nav="'+n[1]+'" href="'+n[0]+'"><b>'+ICONS[n[1] === 'help' ? 'help' : n[1]]+'</b>'+t(n[2])+'</a>';}).join('');
  var menu=[['/','menuHome','home'],['/shops','menuShops','shops'],['/services','menuServices','services'],['/order','menuOrder','order'],['https://merchant.govoexpress.com/onboarding','menuMerchant','merchant'],['https://rider.govoexpress.com/onboarding','menuRider','rider'],['/support','menuSupport','support']];
  document.getElementById('drawerbox').innerHTML=menu.map(function(m){var ext=m[0].indexOf('http')===0;return '<a href="'+m[0]+'"'+(ext?' data-ext="1"':'')+'><span>'+t(m[1])+'</span><b>'+ICONS[m[2]]+'</b></a>';}).join('')+

function submitRequest(opts){ // {source, requestType, data, voiceBlob, images[]}
  if(inFlight)return Promise.reject(new Error('duplicate'));
  inFlight=true;
  var hasFiles=!!(opts.voiceBlob||(opts.images&&opts.images.length));
  var p;
  if(hasFiles){
    var fd=new FormData();
    fd.append('source',opts.source);fd.append('requestType',opts.requestType||'delivery');
    Object.keys(opts.data||{}).forEach(function(k){if(opts.data[k]!=null&&opts.data[k]!=='')fd.append(k,opts.data[k]);});
    if(opts.voiceBlob)fd.append('voice',opts.voiceBlob,'voice.webm');
    (opts.images||[]).forEach(function(b,i){fd.append('images',b,'photo-'+(i+1)+'.jpg');});
    p=api('/requests',{method:'POST',body:fd});
  }else{
    p=postJSON('/requests',Object.assign({source:opts.source,requestType:opts.requestType||'delivery'},opts.data||{}));
  }
  return p.then(function(j){
    var d=opts.data||{};
    saveProfile({name:d.customer_name||'',phone:d.customer_phone||'',area:d.customer_area||'',address:d.customer_address||''});
    if(j.order&&j.order.code)try{localStorage.setItem(lastReqKey,j.order.code);}catch(e){}
    inFlight=false;return j;
  },function(e){inFlight=false;throw e;});
}

/* ================= VOICE WIDGET ================= */
function voiceWidget(container,onChange){
  var rec=null,chunks=[],blob=null,stream=null,timer=null,sec=0;
  var MAX=60;
  function render(state){
    if(state==='unsupported'){container.innerHTML='<p class="hint">'+esc(t('micUnsupported'))+'</p>';return;}
    if(state==='denied'){container.innerHTML='<div class="errorbox"><b>'+esc(t('micDenied'))+'</b><br>'+esc(t('micDeniedSub'))+'</div>';return;}
    if(state==='recording'){container.innerHTML='<div class="recbox"><p><span class="recdot" aria-hidden="true"></span> <b>'+esc(t('recording'))+'… <span id="rec-t">0s</span>/'+MAX+'s</b></p><button type="button" class="btn danger" data-stop>⏹ '+esc(t('micStop'))+'</button><p class="hint">'+esc(t('voiceMax'))+'</p></div>';container.querySelector('[data-stop]').onclick=stop;return;}
    if(state==='ready'){var url=URL.createObjectURL(blob);container.innerHTML='<div class="recbox"><p><b>✅ '+esc(t('voiceReady'))+'</b> ('+sec+'s)</p><audio controls src="'+url+'" aria-label="'+esc(t('replay'))+'"></audio><div class="actions" style="margin:6px 0"><button type="button" class="btn" data-rerec>🎙️ '+esc(t('reRecord'))+'</button><button type="button" class="btn danger" data-del>🗑 '+esc(t('delete'))+'</button></div></div>';container.querySelector('[data-rerec]').onclick=function(){blob=null;onChange(null);start();};container.querySelector('[data-del]').onclick=function(){blob=null;sec=0;onChange(null);render('idle');};return;}
    container.innerHTML='<div class="recbox"><button type="button" class="btn" data-start>🎙️ '+esc(t('micStart'))+'</button><p class="hint">'+esc(t('voiceMax'))+'</p></div>';
    container.querySelector('[data-start]').onclick=start;
  }
  function tick(){sec++;var el=container.querySelector('#rec-t');if(el)el.textContent=sec+'s';if(sec>=MAX)stop();}
  function start(){
    if(!navigator.mediaDevices||!window.MediaRecorder){render('unsupported');return;}
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
      stream=s;chunks=[];sec=0;
      try{rec=new MediaRecorder(s);}catch(e){render('unsupported');s.getTracks().forEach(function(tr){tr.stop();});return;}
      rec.ondataavailable=function(ev){if(ev.data.size)chunks.push(ev.data);};
      rec.onstop=function(){stream.getTracks().forEach(function(tr){tr.stop();});clearInterval(timer);if(chunks.length){blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});onChange(blob);render('ready');}else{render('idle');}};
      rec.start();render('recording');timer=setInterval(tick,1000);
    },function(){render('denied');});
  }
  function stop(){if(rec&&rec.state!=='inactive')rec.stop();}
  render('idle');
  return {getBlob:function(){return blob;}};
}
/* ================= IMAGE WIDGET ================= */
function imageWidget(container,onChange){
  var items=[];var MAXN=3;
  function compress(file){return new Promise(function(res,rej){var img=new Image();var url=URL.createObjectURL(file);img.onload=function(){var M=1280;var w=img.width,h=img.height;var sc=Math.min(1,M/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(function(b){b?res(b):rej(new Error('compress'));},'image/jpeg',.82);};img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('bad image'));};img.src=url;});}
  function render(){
    container.innerHTML='<div class="actions" style="margin:6px 0"><button type="button" class="btn" data-cam>📷 '+esc(t('takePhoto'))+'</button><button type="button" class="btn" data-gal>🖼 '+esc(t('fromGallery'))+'</button></div>'+(items.length?'<p class="hint">'+items.length+'/3 '+esc(t('imagesReady'))+'</p>':'<p class="hint">'+esc(t('imageLimit'))+'</p>')+'<div class="thumbs">'+items.map(function(b,i){return '<div class="thumb"><img alt="photo '+(i+1)+'"><button type="button" data-rm="'+i+'" aria-label="'+esc(t('removeImage'))+'">×</button></div>';}).join('')+'</div>';
    var thumbs=container.querySelectorAll('.thumb img');items.forEach(function(b,i){if(thumbs[i])thumbs[i].src=URL.createObjectURL(b);});
    container.querySelector('[data-cam]').onclick=function(){pick(true);};
    container.querySelector('[data-gal]').onclick=function(){pick(false);};
    container.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){items.splice(+b.getAttribute('data-rm'),1);onChange(items);render();};});
  }
  function pick(cam){
    if(items.length>=MAXN){say(t('imageLimit'));return;}
    var inp=document.createElement('input');inp.type='file';inp.accept='image/jpeg,image/png,image/webp';if(cam)inp.capture='environment';
    inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;compress(f).then(function(b){if(b.size>5*1024*1024){say(t('imageTooBig'));return;}items.push(b);onChange(items);render();},function(){say(t('errorLoad'));});};
    inp.click();
  }
  render();
  return {getImages:function(){return items;}};
}

  '<form class="form card" data-order-form><input type="hidden" name="merchant_id" value="'+esc(params.get('shopId')||'')+'"><div><label for="f-order_type">'+esc(t('requestType'))+'</label><select id="f-order_type" name="requestType"><option value="delivery">'+esc(t('otDelivery'))+'</option><option value="shop">'+esc(t('otShopItem'))+'</option><option value="service">'+esc(t('otHomeService'))+'</option><option value="medicine">'+esc(t('otMedicine'))+'</option><option value="parcel">'+esc(t('otParcel'))+'</option><option value="other">'+esc(t('otOther'))+'</option></select></div>'+
  '<div><label for="f-items">'+esc(t('details'))+' <span aria-hidden="true">*</span></label><textarea id="f-items" name="description" required aria-required="true" placeholder="'+esc(t('detailsPh'))+'">'+esc(params.get('type')||draft.description||'')+'</textarea></div>'+
  contactFields(p)+field('merchant_name','shopProvider','text','',false,params.get('merchant_name')||'')+field('preferred_time','preferredTime','text','preferredTimePh',false)+
  '<div><label for="f-note">'+esc(t('note'))+'</label><textarea id="f-note" name="note" placeholder="'+esc(t('notePh'))+'">'+esc(draft.note||'')+'</textarea></div><button class="btn primary block" type="submit">'+esc(t('submitRequest'))+'</button><p data-submit-state></p></form>';
  bindForms();
}
function renderOneTap(step,state){
  setTitle(t('oneTapTitle'));updateNav('/order');
  state=state||{type:'',data:{}};
  var p=getProfile();
  function stepsBar(n){return '<div class="steps" aria-hidden="true"><i class="'+(n>=1?'on':'')+'"></i><i class="'+(n>=2?'on':'')+'"></i><i class="'+(n>=3?'on':'')+'"></i></div>';}
  if(step===1){
    var types=[['delivery','otDelivery','otDeliverySub','delivery'],['shop','otShopItem','otShopItemSub','shops'],['home_service','otHomeService','otHomeServiceSub','services'],['medicine','otMedicine','otMedicineSub','medicine'],['parcel','otParcel','otParcelSub','parcel'],['other','otOther','otOtherSub','other']];
    main.innerHTML=hero(ICONS.oneTap+' '+t('oneTapTitle'),t('otStep1'),'')+stepsBar(1)+'<div class="typick">'+types.map(function(tp){return '<button type="button" data-type="'+tp[0]+'" aria-pressed="false"><span class="icon">'+ICONS[tp[3]]+'</span><b>'+esc(t(tp[1]))+'</b><small>'+esc(t(tp[2]))+'</small></button>';}).join('')+'</div>';
    main.querySelectorAll('[data-type]').forEach(function(b){b.onclick=function(){state.type=b.getAttribute('data-type');renderOneTap(2,state);};});
    return;
  }
  if(step===2){
    main.innerHTML=hero(ICONS.oneTap+' '+t('oneTapTitle'),t('otStep2'),'')+stepsBar(2)+
    '<form class="form card" data-ot2>'+contactFields(p)+'<div><label for="f-ot-note">'+esc(t('details'))+' ('+esc(t('optional'))+')</label><textarea id="f-ot-note" name="description" placeholder="'+esc(t('detailsPh'))+'"></textarea></div><div class="actions"><button type="button" class="btn" data-back> '+esc(t('back'))+'</button><button class="btn primary" type="submit">'+esc(t('next'))+'</button></div></form>';
    main.querySelector('[data-back]').onclick=function(){renderOneTap(1,state);};
    main.querySelector('[data-ot2]').addEventListener('submit',function(e){e.preventDefault();var d={};new FormData(e.target).forEach(function(v,k){d[k]=v;});if(!d.customer_name||!d.customer_phone||!d.customer_address){say(t('missingFields'));return;}if(!/^(\+?88)?01[0-9]{9}$/.test(String(d.customer_phone).replace(/[^0-9+]/g,''))){say(t('invalidPhone'));return;}state.data=d;renderOneTap(3,state);});
    return;
  }
  // step 3: review + optional voice/images + confirm
  var otLabelKeys={delivery:'otDelivery',shop:'otShopItem',home_service:'otHomeService',medicine:'otMedicine',parcel:'otParcel',other:'otOther'};
  main.innerHTML=hero(ICONS.oneTap+' '+t('oneTapTitle'),t('otStep3'),'')+stepsBar(3)+
  '<section class="card review"><div><span>'+esc(t('reviewType'))+'</span><b>'+esc(t(otLabelKeys[state.type]||'otOther'))+'</b></div><div><span>'+esc(t('yourName'))+'</span><b>'+esc(state.data.customer_name)+'</b></div><div><span>'+esc(t('reviewPhone'))+'</span><b>'+esc(state.data.customer_phone)+'</b></div><div><span>'+esc(t('reviewArea'))+'</span><b>'+esc(state.data.customer_area)+'</b></div><div><span>'+esc(t('reviewAddress'))+'</span><b>'+esc(state.data.customer_address)+'</b></div>'+(state.data.description?'<div><span>'+esc(t('reviewDetails'))+'</span><b>'+esc(state.data.description)+'</b></div>':'')+'</section>'+
  '<section class="card"><h2>'+esc(t('attachVoice'))+'</h2><div data-vw></div></section><section class="card"><h2>'+esc(t('attachImages'))+'</h2><div data-iw></div></section>'+
  '<div class="actions"><button class="btn" data-back>'+esc(t('back'))+'</button><button class="btn primary" data-go style="flex:1">'+esc(t('confirmSubmit'))+'</button></div><p data-submit-state></p>';
  var vw=voiceWidget(main.querySelector('[data-vw]'),function(){});
  var iw=imageWidget(main.querySelector('[data-iw]'),function(){});
  main.querySelector('[data-back]').onclick=function(){renderOneTap(2,state);};
  main.querySelector('[data-go]').onclick=function(){
    if(inFlight)return;
    var btn=main.querySelector('[data-go]');btn.disabled=true;btn.textContent=t('submitting');
    submitRequest({source:'one_tap',requestType:state.type,data:state.data,voiceBlob:vw.getBlob(),images:iw.getImages()}).then(function(j){successPage((j.order&&j.order.code)||'—');},function(err){var st=main.querySelector('[data-submit-state]');if(st)st.innerHTML='<span class="errorbox" style="display:block">'+esc(err.message||t('errorLoad'))+'</span>';btn.disabled=false;btn.textContent=t('confirmSubmit');});
  };
}
function renderVoice(){
  setTitle(t('ctaVoice'));updateNav('/order');
  var p=getProfile();
  main.innerHTML=hero(ICONS.voice+' '+t('ctaVoice'),t('voiceTitle'),t('voiceSub'))+
  '<form class="form card" data-voice-form><section class="card" style="padding:14px"><div data-vw></div></section><div><label for="f-vtext">'+esc(t('details'))+' ('+esc(t('optional'))+')</label><textarea id="f-vtext" name="description" placeholder="'+esc(t('detailsPh'))+'"></textarea></div>'+contactFields(p)+'<button class="btn primary block" type="submit">'+esc(t('submitRequest'))+'</button><p data-submit-state></p></form>';
  var vw=voiceWidget(main.querySelector('[data-vw]'),function(){});
  attachSubmit(main.querySelector('[data-voice-form]'),function(data){
    if(!vw.getBlob()&&!data.description){var st=main.querySelector('[data-submit-state]');if(st)st.innerHTML='<span class="errorbox" style="display:block">'+esc(t('missingDetails'))+'</span>';say(t('missingDetails'));return null;}
    return {source:'voice',requestType:'delivery',data:data,voiceBlob:vw.getBlob()};
  });
}
function renderImage(){
  setTitle(t('ctaImage'));updateNav('/order');
  var p=getProfile();
  main.innerHTML=hero(ICONS.image+' '+t('ctaImage'),t('imageTitle'),t('imageSub'))+
  '<form class="form card" data-image-form><section class="card" style="padding:14px"><div data-iw></div></section><div><label for="f-itext">'+esc(t('details'))+' ('+esc(t('optional'))+')</label><textarea id="f-itext" name="description" placeholder="'+esc(t('detailsPh'))+'"></textarea></div>'+contactFields(p)+'<button class="btn primary block" type="submit">'+esc(t('submitRequest'))+'</button><p data-submit-state></p></form>';
  var iw=imageWidget(main.querySelector('[data-iw]'),function(){});

    if(!iw.getImages().length&&!data.description){var st=main.querySelector('[data-submit-state]');if(st)st.innerHTML='<span class="errorbox" style="display:block">'+esc(t('missingDetails'))+'</span>';say(t('missingDetails'));return null;}
    return {source:'image',requestType:'delivery',data:data,images:iw.getImages()};
  });
}
function renderOrders(id){
  setTitle(t('ordersTitle'));updateNav('/order');
  if(id){
    main.innerHTML=skels(2);
    api('/orders/'+encodeURIComponent(id)).then(function(j){
      var o=j.order||{};
      main.innerHTML=hero(ICONS.track+' '+t('trackingTitle'),o.code||id,t('currentStatus')+': '+statusLabel(o))+
      '<section class="card"><h2>'+esc(t('timeline'))+'</h2>'+((o.timeline||[]).map(function(x){return '<p><b>'+esc(statusLabel(x.status))+'</b> · '+esc(x.note||'')+'<br><small>'+esc(x.timestamp||'')+'</small></p>';}).join('')||'<p>'+esc(t('noTimeline'))+'</p>')+'</section>'+
      '<section class="card"><h2>'+esc(t('detailsCol'))+'</h2><p>'+esc(o.items||'')+'</p><p>'+esc(o.address||'')+'</p>'+(o.voiceFile?'<p><audio controls src="'+esc(o.voiceFile)+'"></audio></p>':'')+((o.imageFiles||[]).length?'<div class="thumbs">'+o.imageFiles.map(function(u){return '<div class="thumb"><img src="'+esc(u)+'" alt="" loading="lazy" onerror="this.closest(\'.thumb\').style.display=\'none\'"></div>';}).join('')+'</div>':'')+'<div class="actions"><a class="btn" href="/support?related_code='+esc(o.code||id)+'">'+esc(t('getSupport'))+'</a><a class="btn" href="/orders">'+esc(t('back'))+'</a></div></section>';
    }).catch(function(e){main.innerHTML=errorBox(e.message);bindRetry(function(){renderOrders(id);});});
    return;
  }
  main.innerHTML=hero(ICONS.track+' '+t('ordersTitle'),t('ordersTitle'),t('ordersSub'))+
  '<form class="form card" data-orders-lookup>'+field('phone','phone','tel','phonePh',true,getProfile().phone)+'<button class="btn primary">'+esc(t('findBtn'))+'</button><div data-results></div></form>';
  bindForms();
}
function renderSupport(){
  setTitle(t('menuSupport'));updateNav('/support');
  var p=new URLSearchParams(location.search);var prof=getProfile();
  main.innerHTML=hero(ICONS.support+' '+t('menuSupport'),t('supportTitle'),t('supportSub'))+
  '<div class="grid">'+(BRAND.supportPhone?'<a class="card link" href="tel:'+esc(BRAND.supportPhone)+'"><div class="icon">☎️</div><h3>'+esc(t('callSupport'))+'</h3><p>'+esc(BRAND.supportPhone)+'</p></a>':'')+'<a class="card link" href="/order"><div class="icon">'+ICONS.order+'</div><h3>'+esc(t('orderHelp'))+'</h3><p>'+esc(t('orderHelpSub'))+'</p></a><a class="card link" href="/orders"><div class="icon">'+ICONS.track+'</div><h3>'+esc(t('trackHelp'))+'</h3><p>'+esc(t('trackHelpSub'))+'</p></a></div>'+
  '<form class="form card" data-support-form>'+field('customer_name','yourName','text','namePh',false,prof.name)+field('customer_phone','phone','tel','phonePh',true,prof.phone)+areaSelect('customer_area',prof.area)+field('subject','subject','text','subjectPh',false)+'<div><label for="f-msg">'+esc(t('message'))+' <span aria-hidden="true">*</span></label><textarea id="f-msg" name="message" required aria-required="true" placeholder="'+esc(t('messagePh'))+'"></textarea></div><input type="hidden" name="related_code" value="'+esc(p.get('related_code')||'')+'"><button class="btn primary block" type="submit">'+esc(t('submitTicket'))+'</button><p data-submit-state></p></form>';
  bindForms();
}
function renderSearch(){
  setTitle(t('searchTitle'));updateNav('/support');
  main.innerHTML=hero(ICONS.search+' '+t('searchTitle'),t('searchTitle'),t('searchSub'))+'<form class="form card" data-search-form><input name="q" required placeholder="'+esc(t('searchPh'))+'" aria-label="'+esc(t('searchPh'))+'"><button class="btn primary">'+esc(t('search'))+'</button><div data-results></div></form>';
  bindForms();
  var inp=main.querySelector('input[name="q"]');var deb=null;
  inp.addEventListener('input',function(){clearTimeout(deb);deb=setTimeout(function(){if(inp.value.trim())main.querySelector('[data-search-form]').requestSubmit();},450);});
}
function renderSimple(kind){
  setTitle(t(kind));updateNav('/support');
  var key=kind==='profile'?'profileEmpty':'notifEmpty';
  main.innerHTML=hero(kind==='profile'?'👤':'🔔',t(kind),'')+'<section class="card"><h2>'+esc(t(kind))+'</h2><p>'+esc(t(key))+'</p><div class="actions"><a class="btn" href="/support">'+esc(t('menuSupport'))+'</a><a class="btn primary" href="/">'+esc(t('navHome'))+'</a></div></section>';
}
function renderNotFound(){
  setTitle(t('notFoundTitle'));updateNav('');
  main.innerHTML=hero('404',t('notFoundTitle'),t('notFoundSub'))+'<section class="card"><div class="actions"><a class="btn primary" href="/">'+esc(t('navHome'))+'</a><a class="btn" href="/shops">'+esc(t('navShops'))+'</a><a class="btn" href="/services">'+esc(t('navServices'))+'</a><a class="btn" href="/support">'+esc(t('menuSupport'))+'</a></div></section>';
}
/* ================= FORM BINDINGS ================= */
function bindForms(){
  document.querySelectorAll('[data-route-filter]').forEach(function(f){f.addEventListener('submit',function(e){e.preventDefault();var q=new URLSearchParams();new FormData(f).forEach(function(v,k){if(v)q.set(k,v);});history.pushState(null,'',path()+(q.toString()?'?'+q:''));route();});});
  document.querySelectorAll('[data-order-form]').forEach(function(f){
    f.addEventListener('input',function(){var o={};new FormData(f).forEach(function(v,k){o[k]=v;});try{localStorage.setItem(draftKey,JSON.stringify(o));}catch(e){}});
    attachSubmit(f,function(data){return {source:data.merchant_id?'shop':'standard_form',requestType:data.requestType||(data.merchant_id?'shop':'delivery'),data:data};});
  });
  document.querySelectorAll('[data-service-form]').forEach(function(f){attachSubmit(f,function(data){if(data.service_type)data.description='['+data.service_type+'] '+(data.description||'');return {source:'service',requestType:'service',data:data};});});
  document.querySelectorAll('[data-support-form]').forEach(function(f){
    var state=f.querySelector('[data-submit-state]');var btn=f.querySelector('button[type="submit"],button:not([type])');
    f.addEventListener('submit',function(e){
      e.preventDefault();if(inFlight)return;inFlight=true;
      if(btn){btn.disabled=true;btn.textContent=t('submitting');}if(state)state.textContent=t('submitting');
      var data={};new FormData(f).forEach(function(v,k){if(v)data[k]=v;});
      postJSON('/support',data).then(function(j){inFlight=false;saveProfile({name:data.customer_name||'',phone:data.customer_phone||'',area:data.customer_area||'',address:''});successPage((j.ticket&&j.ticket.code)||'—',t('submitTicket'));},function(err){inFlight=false;if(state)state.innerHTML='<span class="errorbox" style="display:block">'+esc(err.message||t('errorLoad'))+'</span>';if(btn){btn.disabled=false;btn.textContent=t('submitTicket');}});
    });
  });
  document.querySelectorAll('[data-orders-lookup]').forEach(function(f){f.addEventListener('submit',function(e){e.preventDefault();var phone=new FormData(f).get('phone');var box=f.querySelector('[data-results]');box.innerHTML=skels(2);api('/orders?phone='+encodeURIComponent(phone)).then(function(j){box.innerHTML=(j.orders||[]).map(function(o){return card(ICONS.track,o.code,statusLabel(o)+' · '+(o.address||''),'/orders/'+encodeURIComponent(o.code),t('trackRequest'));}).join('')||'<p>'+esc(t('noOrders'))+'</p>';}).catch(function(err){box.innerHTML='<p class="errorbox">'+esc(err.message)+'</p>';});});});
  document.querySelectorAll('[data-search-form]').forEach(function(f){f.addEventListener('submit',function(e){e.preventDefault();var q=new FormData(f).get('q');var box=f.querySelector('[data-results]');box.innerHTML=skels(2);Promise.all([api('/shops?q='+encodeURIComponent(q)),api('/services?q='+encodeURIComponent(q))]).then(function(r){var html=(r[0].shops||[]).map(function(s){return card(ICONS.shops,s.name,s.category,'/shops/'+s.id,t('navShops'));}).concat((r[1].services||[]).map(function(s){return card(ICONS.services,s.name,s.serviceType,'/services/'+(s.key||s.id),t('navServices'));})).join('');box.innerHTML=html?'<div class="grid">'+html+'</div>':'<p>'+esc(t('noResults'))+'</p>';}).catch(function(err){box.innerHTML='<p class="errorbox">'+esc(err.message)+'</p>';});});});
}
/* ================= ROUTER ================= */
function route(){
  var p=path();
  if(location.pathname!==p&&(location.pathname==='/app'||location.pathname==='/service'||location.pathname==='/help'||/\/$/.test(location.pathname)))history.replaceState(null,'',p+location.search+location.hash);
  window.scrollTo(0,0);updateNav(p);
  if(p==='/')return renderHome();
  if(p==='/shops')return renderShops();
  if(/^\/shops\/[^/]+$/.test(p))return renderShop(decodeURIComponent(p.split('/')[2]));
  if(p==='/services')return renderServices();
  if(/^\/services\/[^/]+$/.test(p))return renderService(decodeURIComponent(p.split('/')[2]));
  if(p==='/order')return renderOrder();
  if(p==='/one-tap')return renderOneTap(1);
  if(p==='/voice')return renderVoice();
  if(p==='/image')return renderImage();
  if(p==='/orders')return renderOrders();
  if(/^\/orders\/[^/]+$/.test(p))return renderOrders(decodeURIComponent(p.split('/')[2]));
  if(p==='/support')return renderSupport();
  if(p==='/search')return renderSearch();
  if(p==='/profile')return renderSimple('profile');
  if(p==='/notifications')return renderSimple('notifications');
  return renderNotFound();
}
document.documentElement.lang=lang==='bl'?'bn-Latn':lang;
renderChrome();updateOffline();route();
})();
</script>
